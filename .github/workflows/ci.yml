name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # The hermetic suite only. Live tests are #[ignore]d on purpose: CI must
      # not go red because huggingface.co had a bad minute, and a test that
      # depends on someone else's uptime is not a test of this code.
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo fmt --all --check

  # Run separately and allowed to fail: these tell us upstream changed
  # something (an API shape, an edge filter, a signing key), which is worth
  # knowing but is not a defect in a pull request.
  live:
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked -- --ignored
